name: 微博轻享版
description: 移除开屏、瀑布流、趋势页、用户中心广告
icon: https://raw.githubusercontent.com/qiny69-oi/7788/refs/heads/main/icon/weibo.png
dns: {}
rewrites:
- match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?(a=get_searching_info&|ct=feed&a=search_topic&)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https?:\/\/api\.weibo\.cn\/2\/ad\/weibointl\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https?:\/\/api\.weibo\.cn\/2\/statuses\/unread_hot_timeline$
  actions:
  - response_body:
      jq: del(.ad, .advertises, .trends) | if .statuses then .statuses |= map(select(((.promotion.type == "ad") or (.mblogtypename | IN("广告", "廣告", "热推", "熱推"))) | not)) end
- match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=get_coopen_ads&
  actions:
  - response_body:
      jq: .data |= . + {"ad_list":[],"pic_ad":[],"gdt_video_ad_ios":[],"display_ad":0,"ad_ios_id":null,"app_ad_ios_id":null,"reserve_ad_ios_id":"","reserve_app_ad_ios_id":"","ad_duration":604800,"ad_cd_interval":604800}
- match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=trends&
  actions:
  - response_body:
      jq: if .data.order then .data.order = ["search_topic"] end
- match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=search_topic&
  actions:
  - response_body:
      jq: if .data.search_topic.cards[0].type == "searchtop" then del(.data.search_topic.cards[0]) end
- match: ^https?:\/\/weibointl\.api\.weibo\.cn\/portal\.php\?a=user_center&
  actions:
  - response_body:
      jq: if .data.cards then .data.cards[].items |= map(select(.type != "personal_vip")) | .data.cards |= map(select((.items | length) > 0)) end
mitm:
  hostnames:
    includes:
    - api.weibo.cn
    - weibointl.api.weibo.cn