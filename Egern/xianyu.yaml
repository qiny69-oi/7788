- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.group\.myself\.banner/
  actions:
  - response_body:
      jq: .data.bannerList = []
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.playboy\.recommend/2\.0
  actions:
  - response_body:
      jq: .data.recommends = [] | .data.items = [] | .data.next = false
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.fun\.follow\.often\.visit
  actions:
  - response_body:
      jq: .data.sections = []
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.fun\.follow\.recommend\.feed\.list
  actions:
  - response_body:
      jq: .data.nextPage = "false" | .data.sections = (.data.sections | map(select(.cardData.userInfo.attention == "true")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.circle\.myself\.banner/1\.0
  actions:
  - response_body:
      jq: .data.bannerList = []
