  actions:
  - response_body:
      jq: .data.tabList = []
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idlehome\.widget\.refresh\.get
  actions:
  - response_body:
      jq: .data.homeTopList = []
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.trade\.full\.info
  actions:
  - response_body:
      jq: .data.components = (.data.components | map(select(.render != "bannerVO")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.trade\.order\.render/
  actions:
  - response_body:
      jq: del(.data.bottomBarVO.benefitPointAtmosphere) | .data.components = (.data.components | map(select(.render != "meanTimeBuyVO")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idlehome\.home\.nextfresh/
  actions:
  - response_body:
      jq: del(.data.widgetReturnDO) | del(.data.bannerReturnDO) | .data.homeTopList = [] | .data.sections = (.data.sections | map(select(.data.bizType != "AD")) | map(select(.data.bizType != "homepage")) | map(select(.template.name != "fish_home_yunying_card_d3")) | map(select(.template.name != "idlefish_seafood_market")) | map(select(.template.name != "fish_home_chat_room")) | map(select(.data.cardTypeValue == "Item")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.local\.home/
  actions:
  - response_body:
      jq: .data.sections = (.data.sections | map(select(.data.bizType != "AD")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.idle\.user\.page\.my\.adapter/
  actions:
  - response_body:
      jq: .data.container.sections = (.data.container.sections | map(select(.index == "0" or .index == "1" or .index == "3"))) | del(.data.container.sections[0].item.level) | .data.ability = []
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idlehome\.home\.circle\.list/
  actions:
  - response_body:
      jq: .data.circleList = (.data.circleList | map(select(.circleId == "1" or .circleId == "2"))) | .data.headList = (.data.headList | map(select(.bizCode == "main" or .bizCode == "recycle"))) | .data.next.headList = (.data.next.headList | map(select(.bizCode == "main" or .bizCode == "recycle")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.local\.nearby\.itemdetail\.enter/
  actions:
  - response_body:
      jq: .data.targetUrl = "" | .data.trackParams.itemIds = "" | .data.name = "" | .data.desc = "" | .data.poiName = "" | .data.nearbyItemInfoList = []
- match: ^https://g-acs\.m\.goofish\.com/gw/mtop\.taobao\.idlemtopsearch\.search/
  actions:
  - response_body:
      jq: del(.data.resultPrefixBar) | .data.topList = [] | .data.resultList = (.data.resultList | map(select(.data.item.main.exContent.isAliMaMaAD != true)) | map(select(.data.item.main.exContent.isAliMaMaAD != "true")) | map(select(.data.template.name != "idlefish_search_card_category_select")) | map(select(.data.template.name != "idlefish_search_spu_market_publish")))
- match: ^https://acs\.m\.goofish\.com/gw/mtop\.taobao\.idle\.local\.flow\.plat\.section
  actions:
  - response_body:
      jq: .data.data.components = (.data.data.components | map(select(.key != "fish_home_activity_enter_cardV1")))
mitm:
  hostnames:
  - acs.m.goofish.com
  - g-acs.m.goofish.com
