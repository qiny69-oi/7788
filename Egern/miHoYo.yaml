name: 米游社
description: 移除开屏广告、搜索栏热搜及资讯、青少年模式弹窗。
icon: https://raw.githubusercontent.com/qiny69-oi/7788/refs/heads/main/icon/miHoYo.png
dns: {}
rewrites:
- match: (?i)^https://bbs-api(-ab)?\.miyoushe\.com/apihub/api/getAppSplash$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://bbs-api(-ab)?\.miyoushe\.com/apihub/api/getAppStartupData$
  actions:
  - response_body:
      jq: delpaths([["data","resp_map","/teenager/api/info"],["data","resp_map","\"/apihub/api/getAppConfig\"","data","get_app_config_response","config","is_show_teenager_mode_btn"],["data","resp_map","\"/apihub/api/getAppConfig\"","data","get_app_config_response","config","teenager_popup_freq_type"]])
- match: (?i)^https://bbs-api(-ab)?\.miyoushe\.com/apihub/api/getAppConfig$
  actions:
  - response_body:
      jq: setpath(["data","config","teenager_popup_freq_type"]; 0) | setpath(["data","config","is_show_teenager_mode_btn"]; 0)
- match: (?i)^https://bbs-api-ab\.miyoushe\.com/teenager/api/info$
  actions:
  - response_body:
      jq: setpath(["data","is_enabled"]; false) | setpath(["data","is_teenager"]; false) | setpath(["data","is_force"]; false)
- match: (?i)^https://bbs-api(-ab)?\.miyoushe\.com/apihub/api/getHotKeywordAndEvent$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: (?i)^https://bbs-api-static\.miyoushe\.com/search/api/search/pre_keyword\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
mitm:
  hostnames:
    includes:
    - bbs-api.miyoushe.com
    - bbs-api-ab.miyoushe.com
