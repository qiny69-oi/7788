name: 滴滴
description: 移除开屏广告、弹窗广告、横幅推广，精简我的页面。
icon: https://raw.githubusercontent.com/qiny69-oi/7788/refs/heads/main/icon/didi.png
dns: {}
rules:
- domain:
    match: hd.xiaojukeji.com
    policy: REJECT
- domain:
    match: gwp.xiaojukeji.com
    policy: REJECT
- domain:
    match: gwpgz.diditaxi.com.cn
    policy: REJECT
- domain:
    match: adtrack.xiaojukeji.com
    policy: REJECT
rewrites:
- match: ^https:\/\/res\.xiaojukeji\.com\/resapi\/activity\/mget(\?|$)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/daijia\.kuaidadi\.com(:443)?\/gateway\?api=(prado\.cms\.delivery\.batch|prado\.cms\.AggregateDeliveryRemoteService\.aggregateDelivery|lj\.c\.p\.queryLevelAndRightsStatus|lj\.cos\.p\.popup)
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/pSFCHomePage\?
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/htwkop-st\.xiaojukeji\.com\/gateway\?api=cms\.htw\.delivery\.batch
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/freight\.xiaojukeji\.com\/gateway\?api=freight\.d\.core\.multiDisplayV\d
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/as\.xiaojukeji\.com\/ep\/as\/toggles\?
  actions:
  - response_body:
      jq: .data |= map(select(.name != "isUseNetConnectivity") | .assign.args.rootca_pin = 0 | .assign.args.sni_list = {})
- match: ^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v\d\/other\/slow\?
  actions:
  - response_body:
      jq: delpaths([["data","order_cards","new_loss_banner_card"],["data","order_cards","call_car_card_80"]])
- match: ^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v\d\/core\?
  actions:
  - response_body:
      jq: .data.order_cards.nav_list_card.data |= map(select(.nav_id == "dache_anycar" or .nav_id == "carmate" or .nav_id == "driverservice" or .nav_id == "bike" or .nav_id == "nav_more_v3")) | .data.disorder_cards.top_nav_list.data.top_nav_info |= map(select(.nav_id == "chu_xing" or .nav_id == "freight_cargo"))
- match: ^https:\/\/conf\.diditaxi\.com\.cn\/homepage\/v\d\/other\/fast\?
  actions:
  - response_body:
      jq: delpaths([["data","disorder_cards","communicate_card"],["data","disorder_cards","not_login_bottom_bar"],["data","disorder_cards","riding_code_card"],["data","disorder_cards","guess_card"],["data","disorder_cards","scene_list_card"],["data","order_cards"],["data","disorder_cards","car_icon","data","icon_info_new_agreement"]])
- match: ^https:\/\/common\.diditaxi\.com\.cn\/common\/v\d\/usercenter\/layout
  actions:
  - response_body:
      jq: .data |= (.instances |= (to_entries | map(select(.key == "center_base_info_card" or .key == "center_wallet_finance_card" or .key == "center_order_related_card")) | from_entries)) | if .data.instances.center_wallet_finance_card.data.view_info then .data.instances.center_wallet_finance_card.data.view_info |= map(select(.title == "优惠卡券")) else . end
- match: ^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/dache_homepage_layout\?
  actions:
  - response_body:
      jq: .data |= (.instances |= (to_entries | map(select(.key | test("feed_back_|dache_main_member|order_container_|dache_main_core_icon|dache_main_card_"))) | from_entries))
- match: ^https:\/\/api\.udache\.com\/intercity\/ticket\/api\/v\d\/core\/getFullPageInfoLayout\?
  actions:
  - response_body:
      jq: .data.disorder_components |= (map(select(.name == "history_order_card" or .name == "inprogress_order_card" or .name == "station_calendar" or .name == "main_card_v2" or .name == "user_history_order")))
- match: ^https:\/\/daijia\.kuaidadi\.com(:443)?\/gateway\?api=lj\.cos\.apolloConfig
  actions:
  - response_body:
      jq: .data |= map(select(.name != "daijia-memberInfo-config" and .name != "daijia-transfer-share-config"))
- match: ^https:\/\/daijia\.kuaidadi\.com(:443)?\/gateway\?api=lj\.cos\.apolloToggle
  actions:
  - response_body:
      jq: .data |= map(select(.name as $n | {daijia_app_estimate_pre_req_switch:true,daijia_agent_car_picture_check:true,daijia_bluetooth_wifi_degrade_switch:true,daijia_weixin_publish_login:true,daijia_estimate_recommend_degrade_switch:true,daijia_yugu_policy_switch:true,daijia_home_location_guide_switch:true,daijia_estimate_switch:true} | has($n)))
- match: ^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/bronze\/pinchengle_homepage_layout$
  actions:
  - response_body:
      jq: .data.instances |= (to_entries | map(select(.key == "dacheanycar-certificates-1" or .key == "main-card-1" or .key == "map-1" or .key == "nav-1" or .key == "tool-container-1")) | from_entries)
- match: ^https:\/\/api\.udache\.com\/gulfstream\/porsche\/v\d\/SFCHomeTab\?
  actions:
  - response_body:
      jq: .data.tab_list |= map(select(.tab_id == "passenger" or .tab_id == "driver"))
- match: ^https:\/\/htwkop\.xiaojukeji\.com(:443)?\/gateway\?api=hm\.fa\.(querySellCardSummary|queryWelfareCenter)
  actions:
  - response_body:
      jq: .data = {}
- match: ^https:\/\/poi\.map\.xiaojukeji\.com\/mapapi\/(startinfo|poiinfo)\?
  actions:
  - response_body:
      jq: del(.rec_destination)
- match: ^https:\/\/common\.diditaxi\.com\.cn\/user_common\/itineraryList\?
  actions:
  - response_body:
      jq: del(.data.tab_nav[]?.tab_param)
mitm:
  hostnames:
    includes:
    - as.xiaojukeji.com
    - conf.diditaxi.com.cn
    - common.diditaxi.com.cn
    - res.xiaojukeji.com
    - api.udache.com
    - daijia.kuaidadi.com
    - htwkop-st.xiaojukeji.com
    - htwkop.xiaojukeji.com
    - freight.xiaojukeji.com
    - poi.map.xiaojukeji.com
    - 162.14.157.*
    - 123.207.209.*
    - 112.53.55.225
    - 116.85.*
    - 120.241.142.*
    - 120.241.143.*
    - 139.199.240.84
