name: 京东
description: 去除京东开屏广告
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/JD.png
dns: {}
rewrites:
- match: ^https?://[^/]+\.360buyimg\.com/mobilecms/s1\d{3}x2\d{3}_jfs/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: image/gif
      body:
        base64: R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==
- match: ^https?://[^/]*360buyimg\.com/material-video/
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: video/mp4
- match: ^https?://api\.m\.jd\.com/client\.action\?(?:[^#]*&)?functionId=queryPagePopWindow(?:&[^#]*)?$
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https?://api\.m\.jd\.com/client\.action\?(?:[^#]*&)?functionId=start(?:&[^#]*)?$
  actions:
  - response_body:
      jq: if (.images) then .images = [] else . end | .showTimesDaily = 0 | .countdown = 0 | .showTimes = 0
- match: ^https?://api\.m\.jd\.com/client\.action\?(?:[^#]*&)?functionId=welcomeHome(?:&[^#]*)?$
  actions:
  - response_body:
      jq: if (.images) then .images = [] else . end | .showTimesDaily = 0 | .countdown = 0
mitm:
  hostnames:
  - api.m.jd.com
  - '*.360buyimg.com'
