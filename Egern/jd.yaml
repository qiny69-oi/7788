name: 京东
description: 过滤京东 App 开屏广告
icon: https://raw.githubusercontent.com/qiny69-oi/7788/refs/heads/main/icon/jd.png
dns: {}
rewrites:
- match: ^https?://api\.m\.jd\.com/client\.action\?functionId=queryMaterialAdverts
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https?://(bdsp-x|dsp-x)\.jd\.com/adx/
  actions:
  - respond:
      status: 404
- match: ^https?://m\.360buyimg\.com/mobilecms/s1260x2736_jfs
  actions:
  - respond:
      status: 200
- match: ^https?://api\.m\.jd\.com/client\.action\?functionId=start
  actions:
  - response_body:
      jq: .images = [] | .showTimesDaily = 0
mitm:
  hostnames:
  - api.m.jd.com
  - m.360buyimg.com
