name: 酷安
description: 过滤酷安广告
icon: https://raw.githubusercontent.com/qiny69-oi/7788/refs/heads/main/icon/coolapk.png
dns: {}
rules:
- domain_suffix:
    match: pangolin-sdk-toutiao.com
    policy: REJECT
- domain_suffix:
    match: pangolin-sdk-toutiao-b.com
    policy: REJECT
- domain_suffix:
    match: pglstatp-toutiao.com
    policy: REJECT
- domain_suffix:
    match: pangle.io
    policy: REJECT
- domain:
    match: ad.toutiao.com
    policy: REJECT
- domain_suffix:
    match: gdt.qq.com
    policy: REJECT
- domain_suffix:
    match: gdtimg.com
    policy: REJECT
- domain_suffix:
    match: pgdt.gtimg.cn
    policy: REJECT
- domain_suffix:
    match: ad.qq.com
    policy: REJECT
- domain_suffix:
    match: kuaishouzt.com
    policy: REJECT
- domain_suffix:
    match: open.e.kuaishou.com
    policy: REJECT
- domain_suffix:
    match: kwaiad.com
    policy: REJECT
- domain_suffix:
    match: adkwai.com
    policy: REJECT
rewrites:
- match: ^https:\/\/api\.coolapk\.com\/v6\/search\?.*type=hotSearch
  actions:
  - respond:
      status: 200
      headers:
        Content-Type: application/json
      body: '{}'
- match: ^https:\/\/api\.coolapk\.com\/v6\/feed\/detail\?
  actions:
  - response_body:
      jq: try (.data.hotReplyRows |= if . then map(select(.id?)) else . end | .data.topReplyRows |= if . then map(select(.id?)) else . end | reduce ("detailSponsorCard", "include_goods", "include_goods_ids") as $key (.; .data[$key] = [])) catch .
- match: ^https:\/\/api\.coolapk\.com\/v6\/feed\/replyList
  actions:
  - response_body:
      jq: try (if .data? and ((.data | type) == "array") and (.data | length > 0) then .data |= map(select(.id?)) else . end) catch .
- match: ^https:\/\/api\.coolapk\.com\/v6\/main\/dataList
  actions:
  - response_body:
      jq: try (.data |= (if (type=="array" and length>0) then map(select((.entityTemplate!="sponsorCard") and (.title!="精选配件"))) else . end)) catch .
- match: ^https:\/\/api\.coolapk\.com\/v6\/page\/dataList
  actions:
  - response_body:
      jq: try (.data |= (if (type=="array" and length>0) then map(select((.title? != "话题热议") and (.title? != "酷安热搜") and (.entityTemplate? != "imageScaleCard") and (.entityTemplate? != "sponsorCard") and (.entityId? != 36104 and .entityId? != 24309 and .entityId? != 12889 and .entityId? != 21063 and .entityId? != 35730 and .entityId? != 35846 and .entityId? != 28374 and .entityId? != 28375 and .entityId? != 27332 and .entityId? != 20090 and .entityId? != 28773 and .entityId? != 29343 and .entityId? != 21106)) | if .entities then .entities |= map(select(.title? != "睡个好觉需要什么？")) else . end) else . end)) catch .
- match: ^https:\/\/api\.coolapk\.com\/v6\/main\/indexV8
  actions:
  - response_body:
      jq: .data |= map(select(.entityTemplate != "sponsorCard")) | .data |= map(select(.entityTemplate != "imageCarouselCard_1")) | .data |= map(select(.entityId != 8639)) | .data |= map(select(.entityId != 29349)) | .data |= map(select(.entityId != 33006)) | .data |= map(select(.entityId != 32557)) | .data |= map(select(.entityId != 28621)) | .data |= map(select(.title != "值得买")) | .data |= map(select(.title != "红包"))
- match: ^https:\/\/api\.coolapk\.com\/v6\/main\/init
  actions:
  - response_body:
      jq: try (del(.data[]? | select(.entityId? == 944 or .entityId? == 945 or .entityId? == 6390 or .entityId? == 24455 or .entityId? == 36839 or .entityId? == 1635 or .title? == "关注")) | .data |= map(if .entityId? == 20131 then .entities |= map(select(.title? != "酷品")) else . end) | .data |= map(if .entities then .entities |= map(select(.entityId? != 1635 and .entityId? != 2261 and .entityId? != 1633 and .entityId? != 413 and .entityId? != 417 and .entityId? != 1754 and .entityId? != 1966 and .entityId? != 2274 and .entityId? != 1170 and .entityId? != 1175 and .entityId? != 1190 and .entityId? != 2258 and .title? != "关注")) else . end)) catch .
- match: ^https:\/\/api\.coolapk\.com\/v6\/account\/loadConfig\?key=my_page_card_config
  actions:
  - response_body:
      jq: try (.data |= map(select(.entityType != "textLink" and (.entityId != 1001 and .entityId != 1003 and .entityId != 1004 and .entityId != 1005)) | if .entities then .entities |= map(select(.entityType != "textLink")) else . end)) catch .
mitm:
  hostnames:
    includes:
    - api.coolapk.com
